# =============================================================================
# ACL4SSR 规则同步构建工作流
# 每天 UTC 01:00 自动同步上游 ACL4SSR 仓库的 Clash 规则
# 当 Rules/ 目录有手动推送时，等待 3 分钟后自动触发构建
# =============================================================================
name: Build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"
  push:
    paths:
      - 'Rules/**'

# 同一时间只允许一个构建运行，防止并发冲突
concurrency:
  group: build-acl4ssr
  cancel-in-progress: false

# 需要写权限用于推送变更，actions 权限用于清理历史运行记录
permissions:
  contents: write
  actions: write

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      TZ: "Asia/Shanghai"

    steps:
    # =========================================================================
    # Step 1: 检出仓库
    # =========================================================================
    - name: Checkout Repository
      uses: actions/checkout@v6.0.3

    # =========================================================================
    # Step 2: 从上游 ACL4SSR 仓库同步 Clash 规则
    # =========================================================================
    - name: Sync ACL4SSR Rules
      run: |
        set -euo pipefail
        rm -rf Rules
        mkdir -p Rules
        git clone -b master --depth 1 https://github.com/ACL4SSR/ACL4SSR.git ACL4SSR_Tmp
        find ACL4SSR_Tmp/Clash -type f -name '*.list' -exec cp {} Rules \;
        rm -rf ACL4SSR_Tmp

    # =========================================================================
    # Step 3: 源文件标准化、排序与去重
    # =========================================================================
    - name: Source sort
      run: |
        set -euo pipefail
        cd Rules
        for file in *.list; do
          if [ -f "$file" ]; then
            # 清理注释、空行、行内注释
            sed -i -e '/^\s*[#;]/d' -e '/^$/d' -e 's| //.*||' "$file"
            # 自动识别裸 IP 地址并添加 IP-CIDR, 前缀
            sed -i -E '/^IP-CIDR,/!{/^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\/[0-9]+/s/^/IP-CIDR,/}' "$file"
            # 自动识别裸 IPv6 地址并添加 IP-CIDR6, 前缀
            sed -i -E '/^IP-CIDR6,/!{/^[a-fA-F0-9]+:|([a-fA-F0-9]+:+)+[a-fA-F0-9]+\/[0-9]+/s/^/IP-CIDR6,/}' "$file"
            # 按规则类型分组排序
            awk '
            /^DOMAIN,/         { print "0 " $0; next }
            /^DOMAIN-SUFFIX,/  { print "1 " $0; next }
            /^DOMAIN-KEYWORD,/ { print "2 " $0; next }
            /^DOMAIN-WILDCARD,/{ print "3 " $0; next }
            /^IP-CIDR,/        { print "4 " $0; next }
            /^IP-CIDR6,/       { print "5 " $0; next }
            /^IP-ASN,/         { print "6 " $0; next }
            /^PROCESS-NAME,/   { print "7 " $0; next }
            /^URL-REGEX,/      { print "8 " $0; next }
            /^USER-AGENT,/     { print "9 " $0; next }
            /^GEOIP,/          { print "10 " $0; next }
            /^AND,/            { print "11 " $0; next }
            /^OR,/             { print "12 " $0; next }
            /^NOT,/            { print "13 " $0; next }
            /^DEST-PORT,/      { print "14 " $0; next }
                               { print "15 " $0; next }
            ' "$file" | sort -k1,1n -k2,2 | cut -d' ' -f2- > "$file.sorted" && mv "$file.sorted" "$file"
            # 大小写不敏感去重
            awk '!seen[tolower($0)]++' "$file" > temp && mv temp "$file"
          else
            echo "$file not found."
          fi
        done

    # =========================================================================
    # Step 4: 平台适配（Surge/QX 格式转换 + 策略名追加）
    # =========================================================================
    - name: Platform Adaptation
      run: |
        set -euo pipefail
        cd Rules
        for file in *.list; do
          if [ -f "$file" ]; then
            # 删除逻辑规则（Surge/QX 原生不支持 AND/OR/NOT/DEST-PORT）
            sed -i -e '/^PROCESS-NAME/d' "$file"
            sed -i -e '/^AND/d' "$file"
            sed -i -e '/^OR/d' "$file"
            sed -i -e '/^NOT/d' "$file"
            sed -i -e '/^DEST-PORT/d' "$file"
            # SURGE 格式规则类型 → QX 格式（仅 DOMAIN 相关规则）
            sed -i -e 's/^DOMAIN,/HOST,/g' "$file"
            sed -i -e 's/^DOMAIN-SUFFIX,/HOST-SUFFIX,/g' "$file"
            sed -i -e 's/^DOMAIN-KEYWORD,/HOST-KEYWORD,/g' "$file"
            sed -i -e 's/^DOMAIN-WILDCARD,/HOST-WILDCARD,/g' "$file"
            sed -i -e 's/^IP-CIDR6,/IP6-CIDR,/g' "$file"
            # 移除 no-resolve 后缀
            sed -i 's/,no-resolve//g' "$file"

            # 添加元数据注释头和策略名
            file_names=$(basename "$file" .list)
            line_count=$(wc -l < "$file")
            tmpfile=$(mktemp)
            awk -v policy="$file_names" '!/^#|^ *$/ {print $0","policy; next} {print}' "$file" > "$tmpfile" && mv "$tmpfile" "$file"
            tmpfile=$(mktemp)
            awk -v fname="$file_names" 'NR==1 {print "# 规则名称: " fname} {print}' "$file" > "$tmpfile" && mv "$tmpfile" "$file"
            tmpfile=$(mktemp)
            awk -v count="$line_count" 'NR==2 {print "# 规则统计: " count} {print}' "$file" > "$tmpfile" && mv "$tmpfile" "$file"
            sed -i '2a\\' "$file"
          else
            echo "$file not found."
          fi
        done

    # =========================================================================
    # Step 5: 提交并推送变更
    # =========================================================================
    - name: Push Update
      run: |
        set -euo pipefail
        if [[ -n $(git status -s) ]]; then
          git config --local user.email "${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"
          git add -A
          TIMESTAMP="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          git commit -m "sync(ACL4SSR): ${TIMESTAMP}"
          git push origin "${{ github.ref_name }}"
        else
          echo "No changes to commit."
        fi

    # =========================================================================
    # Step 6: 清理历史 Workflow 运行记录，仅保留最近 2 次
    # =========================================================================
    - name: Cleanup Workflow
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2
